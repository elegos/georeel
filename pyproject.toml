[build-system]
requires = ["setuptools>=74"]
build-backend = "setuptools.build_meta"

[project]
name = "georeel"
version = "1.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.0",
    "gpxpy>=1.6.2",
    "httpx>=0.28.1",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pyside6>=6.11.0",
    "python-multipart>=0.0.26",
    "scipy>=1.17.1",
    "srtm-py>=0.3.7",
    "uvicorn[standard]>=0.44.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.0",
    "pyside6-stubs>=6.7.3.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[project.scripts]
georeel        = "georeel.main:main"
georeel-server = "georeel.server.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
georeel = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/georeel"]
branch = true
relative_files = true

[tool.coverage.report]
omit = [
  "**/main.py",
  "**/ui/**",
  "**/blender_scripts/**"
]
